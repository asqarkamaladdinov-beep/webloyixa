<!DOCTYPE html>
<html lang="uz"
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Buyruqlari Ma'lumotnomasi</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #2ea043;
      --accent-hover: #3fb950;
      --code-bg: #21262d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    p.subtitle {
      color: #8b949e;
      margin-bottom: 1.5rem;
    }

    .search-box {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: #58a6ff;
    }

    .command-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .command-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .command-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .command-title {
      font-weight: 600;
      color: #58a6ff;
    }

    .command-desc {
      font-size: 0.9rem;
      color: #8b949e;
    }

    .command-code-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--code-bg);
      padding: 0.6rem 0.8rem;
      border-radius: 4px;
      border: 1px solid #282e33;
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      color: #e6edf3;
      font-size: 0.95rem;
    }

    .copy-btn {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .copy-btn:hover {
      background-color: var(--accent-hover);
    }

    .no-results {
      text-align: center;
      color: #8b949e;
      margin-top: 2rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Git Buyruqlari Cheat Sheet</h1>
      <p class="subtitle">Tezkor qidiruv va kodlarni nusxalash imkoniyati</p>
      <input type="text" id="searchInput" class="search-box" placeholder="Buyruq yoki tavsif bo'yicha qidiring (masalan: commit, push, branch)...">
    </header>

    <main class="command-list" id="commandList">
      <!-- Buyruqlar JS orqali chiqariladi -->
    </main>
    <div id="noResults" class="no-results">Hech narsa topilmadi.</div>
  </div>

  <script>
    const commands = [
      { cmd: "git init", desc: "Yangi mahalliy Git repozitoriyasini yaratish" },
      { cmd: "git clone <url>", desc: "Masofaviy repozitoriyani kompyuterga ko'chirib olish" },
      { cmd: "git status", desc: "O'zgartirilgan va kuzatilmayotgan fayllar holatini ko'rish" },
      { cmd: "git add .", desc: "Barcha o'zgarishlarni indeksatsiyaga (staging) qo'shish" },
      { cmd: "git commit -m \"izoh\"", desc: "O'zgarishlarni izoh bilan saqlash (commit qilish)" },
      { cmd: "git branch", desc: "Mavjud tarmoqlar (branch) ro'yxatini ko'rish" },
      { cmd: "git branch <nomi>", desc: "Yangi tarmoq yaratish" },
      { cmd: "git checkout -b <nomi>", desc: "Yangi tarmoq yaratib, darhol unga o'tish" },
      { cmd: "git checkout <nomi>", desc: "Boshqa tarmoqga o'tish" },
      { cmd: "git push origin main", desc: "Loyiha o'zgarishlarini masofaviy repozitoriyaga yuborish" },
      { cmd: "git pull", desc: "Masofaviy repozitoriyadagi oxirgi o'zgarishlarni yuklab olish" },
      { cmd: "git log", desc: "Commit'lar tarixini ko'rish" }
    ];

    const commandList = document.getElementById('commandList');
    const searchInput = document.getElementById('searchInput');
    const noResults = document.getElementById('noResults');

    function renderCommands(items) {
      commandList.innerHTML = '';
      if (items.length === 0) {
        noResults.style.display = 'block';
        return;
      }
      noResults.style.display = 'none';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'command-card';
        card.innerHTML = `
          <div class="command-header">
            <span class="command-title">${item.cmd.split(' ')[1] || item.cmd}</span>
            <span class="command-desc">${item.desc}</span>
          </div>
          <div class="command-code-box">
            <code>${item.cmd}</code>
            <button class="copy-btn" onclick="copyCode('${item.cmd}', this)">Nusxalash</button>
          </div>
        `;
        commandList.appendChild(card);
      });
    }

    function copyCode(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerText;
        btn.innerText = 'Nusxalandi!';
        btn.style.backgroundColor = '#1f6feb';
        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.backgroundColor = 'var(--accent-color)';
        }, 1500);
      });
    }

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = commands.filter(item => 
        item.cmd.toLowerCase().includes(term) || 
        item.desc.toLowerCase().includes(term)
      );
      renderCommands(filtered);
    });

    renderCommands(commands);
  </script>
</body>
</html>
